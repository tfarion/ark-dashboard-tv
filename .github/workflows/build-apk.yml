name: Build ARK Dashboard TV APK

# Builds the TV kiosk APK in the cloud — no local Android Studio needed. Runs on every
# push and can be triggered by hand (Actions ▸ Build ARK Dashboard TV APK ▸ Run). Download
# the result under the run's "Artifacts". Rebuild only for NATIVE changes (icon, name, the
# dashboard URL, a permission) — the dashboard itself is web, so day-to-day needs none.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner already ships the Android SDK (platforms + build-tools +
      # accepted licences), so no setup-android step is needed — and android-actions/
      # setup-android@v3 fails trying to install the removed legacy 'tools' package.

      # Provides Gradle 8.7 on PATH (AGP 8.5 needs it) — no wrapper jar to commit.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ark-dashboard-tv-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
